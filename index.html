<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alpha Clash pro</title>
    <!-- Tailwind and DaisyUI -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles/style.css" />
    <!-- Theme link -->
    <html data-theme="light"></html>
  </head>
  <body class="font-poppins">
    <header></header>
    <main
      class="min-h-screen bg-[#010313] bg-[url(images/background.png)] bg-no-repeat bg-center"
    >
      <!-- Home screen -->
      <section
        id="home-screen"
        class="min-h-screen flex justify-center items-center text-white"
      >
        <div class="flex flex-col justify-center items-center gap-9">
          <h1 class="text-9xl font-normal font-anton">ALPHABET CLASH</h1>
          <p class="text-2xl font-medium">
            Unleash Your Keyboard Kung Fu : Press “Enter” to Play
          </p>
          <button
            onclick="play()"
            class="btn btn-primary bg-white hover:bg-white text-2xl font-semibold text-black"
          >
            Play Now
          </button>
        </div>
      </section>
      <!-- PlayGround Start -->
      <section id="play-ground" class="hidden">
        <!-- PlayGround container -->
        <div
          class="flex flex-col justify-center items-center min-h-screen gap-24"
        >
          <!-- Screen section -->
          <div
            class="artboard artboard-horizontal phone-6 border-[20px] border-solid border-[#010313CC] rounded-2xl bg-[#FFFFFFB3]"
          >
            <div class="flex justify-center">
              <p
                class="bg-[#2F2941] px-7 pb-4 rounded-b-xl text-white text-lg font-medium"
              >
                Don't watch keyboard while playing...
              </p>
            </div>
            <div class="flex items-center justify-center min-h-full">
              <p
                id="currentAlphabet"
                class="text-[#010313] text-9xl font-semibold uppercase"
              >
                Y
              </p>
            </div>
          </div>
          <!-- keyboard section -->
          <div>
            <!-- keyboard start -->
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="q" class="kbd">q</kbd>
              <kbd id="w" class="kbd">w</kbd>
              <kbd id="e" class="kbd">e</kbd>
              <kbd id="r" class="kbd">r</kbd>
              <kbd id="t" class="kbd">t</kbd>
              <kbd id="y" class="kbd">y</kbd>
              <kbd id="u" class="kbd">u</kbd>
              <kbd id="i" class="kbd">i</kbd>
              <kbd id="o" class="kbd">o</kbd>
              <kbd id="p" class="kbd">p</kbd>
            </div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="a" class="kbd">a</kbd>
              <kbd id="s" class="kbd">s</kbd>
              <kbd id="d" class="kbd">d</kbd>
              <kbd id="f" class="kbd">f</kbd>
              <kbd id="g" class="kbd">g</kbd>
              <kbd id="h" class="kbd">h</kbd>
              <kbd id="j" class="kbd">j</kbd>
              <kbd id="k" class="kbd">k</kbd>
              <kbd id="l" class="kbd">l</kbd>
            </div>
            <div class="my-1 flex w-full justify-center gap-1">
              <kbd id="z" class="kbd">z</kbd>
              <kbd id="x" class="kbd">x</kbd>
              <kbd id="c" class="kbd">c</kbd>
              <kbd id="v" class="kbd">v</kbd>
              <kbd id="b" class="kbd">b</kbd>
              <kbd id="n" class="kbd">n</kbd>
              <kbd id="m" class="kbd">m</kbd>
              <kbd id="/" class="kbd">/</kbd>
            </div>
            <!-- keyboard end -->
          </div>
          <!-- life and score section -->
          <div class="min-w-full flex justify-around">
            <!-- Game life section -->
            <button
              class="btn bg-[#894189] border-none rounded-full text-white font-inter text-xl font-medium px-9 hover:bg-[#894189]"
            >
              Life
              <img src="images/heart.svg" alt="" />
              <span id="current-life">3</span>
            </button>
            <!-- Score section -->
            <button
              class="btn bg-[#360490] border-none hover:bg-[#360490] rounded-3xl text-white font-inter font-medium text-xl px-8"
            >
              Score
              <img src="images/dollar.svg" alt="" />
              <span id="current-score">0</span>
            </button>
          </div>
        </div>
      </section>
      <!-- PlayGround end -->
      <!-- Final score and Play again -->
      <section
        id="final-score"
        class="text-white flex justify-center items-center min-h-screen hidden"
      >
        <div
          class="bg-[#ffffff33] border border-[#FFFFFF33] rounded-2xl w-96 h-72 flex flex-col justify-center items-center gap-4"
        >
          <h4 class="text-3xl">Game Over !</h4>
          <h1>
            <span class="text-6xl font-extrabold">Score :</span>
            <span class="text-6xl font-extrabold" id="game-score">0</span>
          </h1>
          <button
            id="play-again"
            onclick="play()"
            class="btn w-60 text-black px-8 bg-white hover:bg-white text-2xl font-semibold"
          >
            Play Again
          </button>
          <p class="text-xl font-medium">Practice will make you Pro</p>
        </div>
      </section>
    </main>
    <footer></footer>
    <script src="Scripts/utility.js"></script>
    <script src="Scripts/alpha-clash.js"></script>
  </body>
</html>
